name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pytest
      - run: python -c "from orchestrator.workflow import WorkflowEngine, Task; e=WorkflowEngine(); e.add_task(Task('a',lambda: 42,{})); e.add_task(Task('b',lambda a: a*2,{},depends_on=['a'])); r=e.run(); assert r['b'].output==84; print('workflow OK')"
      - run: python run_workflow.py --workflow demo
